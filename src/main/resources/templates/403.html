<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Access Denied - DataMasker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, Helvetica, sans-serif;

            background: #f5f7fa;
        }

        .container {
            text-align: center;
            padding: 40px;
        }

        .code {
            font-size: 96px;
            font-weight: 700;
            color: #4f46e5;
            margin: 0;
        }

        h1 {
            margin: 10px 0;
            color: #222;
        }

        p {
            color: #666;
            margin-bottom: 30px;
        }

        a {
            display: inline-block;

            padding: 12px 24px;

            border-radius: 8px;

            background: #4f46e5;

            color: white;

            text-decoration: none;

            font-weight: 600;
        }

        a:hover {
            background: #4338ca;
        }
    </style>
</head>

<body>

<div class="container">

    <p class="code">403</p>

    <h1>Access Denied</h1>

    <p>
        Sorry, you don't have permission to access this page.
    </p>

    <a th:href="@{/}">
        Back to Home
    </a>

</div>

</body>

</html>
