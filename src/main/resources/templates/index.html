<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <meta charset="UTF-8">
    <title>File Manager</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f5f5f5;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,.1);
        }

        h2 {
            margin-top: 0;
        }

        input[type=text] {
            width: 500px;
            padding: 10px;
        }

        input[type=file] {
            padding: 10px 0;
        }

        button {
            background: #0d6efd;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 4px;
        }

        button:hover {
            background: #0b5ed7;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        table th {
            background: #f0f0f0;
        }

        table th,
        table td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        .folder {
            color: #ff9800;
            font-weight: bold;
        }

        .file {
            color: #333;
        }

    </style>
</head>

<body>
<!-- Success Toast -->
<div class="toast-container position-fixed top-0 end-0 p-3">

    <div id="successToast"
         class="toast align-items-center text-bg-success border-0"
         role="alert"
         aria-live="assertive"
         aria-atomic="true"
         th:if="${successFile != null}">

        <div class="d-flex">

            <div class="toast-body">

                <strong>Upload successful!</strong>
                <br>

                <span th:text="${successFile}">
                    filename.txt
                </span>

            </div>

            <button type="button"
                    class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast"
                    aria-label="Close">
            </button>

        </div>

    </div>

</div>
<div class="card">

    <h2>Upload File</h2>

    <form method="post"
          enctype="multipart/form-data"
          th:action="@{/upload}">

        <div style="margin-bottom:10px;">
            <label>Upload Directory</label>
            <br>
            <input type="text"
                   name="uploadPath"
                   placeholder="C:/UPLOADS"
                   required
                   style="width:500px;padding:10px;">
        </div>

        <div style="margin-bottom:10px;">
            <input type="file"
                   name="file"
                   required>
        </div>
        <button type="submit" class="btn btn-primary">
            Upload
        </button>
    </form>

</div>


<div class="card">

    <h2>Browse Folder</h2>

    <form method="get"
          th:action="@{/files}">

        <input type="text"
               name="path"
               th:value="${currentPath}"
               placeholder="C:/UPLOADS">
        <button type="submit" class="btn btn-primary">
            Search
        </button>
    </form>

    <table>

        <thead>
        <tr>
            <th>Name</th>
            <th>Type</th>
            <th>Size</th>
            <th>Modified Date</th>
        </tr>
        </thead>

        <tbody>

        <tr th:if="${#lists.isEmpty(files)}">
            <td colspan="4">
                No files found
            </td>
        </tr>

        <tr th:each="file : ${files}">

            <td th:text="${file.name}"></td>

            <td>
                <span class="folder"
                      th:if="${file.directory}">
                    Folder
                </span>

                <span class="file"
                      th:unless="${file.directory}">
                    File
                </span>
            </td>

            <td th:text="${file.size}"></td>

            <td th:text="${file.modifiedDate}"></td>

        </tr>

        </tbody>

    </table>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
<script th:if="${successFile != null}"
        th:inline="javascript">

    document.addEventListener("DOMContentLoaded", function () {

        const toastElement =
            document.getElementById("successToast");

        const toast =
            new bootstrap.Toast(toastElement, {
                delay: 4000
            });

        toast.show();

    });

</script>
</html>
