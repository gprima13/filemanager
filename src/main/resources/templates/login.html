<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>DataMasker - Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                    Arial,
                    Helvetica,
                    sans-serif;

            background:
                    linear-gradient(
                            135deg,
                            #f5f7fa,
                            #e4e9f2
                    );
        }

        .login-container {
            width: 100%;
            max-width: 400px;

            padding: 20px;
        }

        .login-card {
            background: white;

            padding: 40px;

            border-radius: 16px;

            box-shadow:
                    0 10px 40px
                    rgba(0, 0, 0, 0.10);
        }

        .logo {
            text-align: center;

            margin-bottom: 30px;
        }

        .logo h1 {
            margin: 0;

            color: #222;

            font-size: 28px;
        }

        .logo p {
            margin-top: 8px;

            color: #777;

            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            color: #444;

            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;

            padding: 12px 14px;

            border: 1px solid #ddd;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #4f46e5;

            box-shadow:
                    0 0 0 3px
                    rgba(79, 70, 229, 0.10);
        }

        button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #4f46e5;

            color: white;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        .error,
        .logout {
            padding: 10px;

            margin-bottom: 20px;

            border-radius: 8px;

            font-size: 14px;

            text-align: center;
        }

        .error {
            background: #fee2e2;

            color: #b91c1c;
        }

        .logout {
            background: #dcfce7;

            color: #166534;
        }

        .footer {
            margin-top: 25px;

            color: #999;

            font-size: 12px;

            text-align: center;
        }

    </style>

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">

            <h1>File Manager</h1>

            <p>Sign in to continue</p>

        </div>

        <div class="error"
             th:if="${param.error}">

            Invalid username or password.

        </div>

        <div class="logout"
             th:if="${param.logout}">

            You have been logged out.

        </div>

        <form method="post"
              th:action="@{/login}">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                        id="username"
                        name="username"
                        type="text"
                        autocomplete="username"
                        placeholder="Enter username"
                        required>
            </div>
            <div class="form-group">
                <label for="password">
                    Password
                </label>
                <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter password" required>
            </div>
            <button type="submit">
                Sign In
            </button>
        </form>
        <div class="footer">
            File Manager
        </div>
    </div>
</div>
</body>
</html>
